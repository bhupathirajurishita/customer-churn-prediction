name: Daily progress
description: Record real progress on the customer churn project
title: "Daily progress: "
body:
  - type: markdown
    attributes:
      value: |
        Use this after actual project or study work related to customer churn. Your answers and this issue will be public. The workflow archives the entry and closes the issue. Do not submit filler just to create a contribution.
  - type: textarea
    id: work
    attributes:
      label: What did you work on?
      description: Name the specific part of the project or concept.
      placeholder: "Example: compared recall and precision for the tuned Random Forest."
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed, did you test, or learn?
      description: Describe the concrete work or learning from this session.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or result
      description: Include a file, metric, test result, or concise factual observation.
    validations:
      required: true
  - type: textarea
    id: next
    attributes:
      label: Next step
      description: A useful follow-up, if you have one.
    validations:
      required: false
